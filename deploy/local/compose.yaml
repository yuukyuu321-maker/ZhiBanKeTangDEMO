services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: athena
      POSTGRES_USER: athena_owner
      POSTGRES_PASSWORD: ${ATHENA_DB_OWNER_PASSWORD:-local-owner-only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena_owner -d athena"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - athena-postgres-data:/var/lib/postgresql/data

volumes:
  athena-postgres-data:
