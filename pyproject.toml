[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-athena-textbook-mvp"
version = "0.1.0"
description = "Project Athena textbook knowledge and teacher preparation MVP"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
athena-textbook = "athena_ingestion.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pypdfium2>=4,<5",
  "reportlab>=4,<5",
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = [
  "packages/audit/src",
  "packages/domain/src",
  "packages/model-gateway/src",
  "packages/textbook-ingestion/src",
]
